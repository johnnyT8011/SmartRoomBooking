spring.application.name=meeting-room

# ---- H2 in-memory database ----
spring.datasource.url=jdbc:h2:mem:meetingroom;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# ---- JPA / Hibernate ----
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
# Disable open-in-view so lazy loading only happens inside @Transactional service methods.
spring.jpa.open-in-view=false

# ---- H2 web console at http://localhost:8080/h2-console ----
spring.h2.console.enabled=true

# 本機沒設 PORT 時用 8080；雲端平台(如 Render)會用 PORT 環境變數指定埠
server.port=${PORT:8080}

# ---- CORS Configuration ----
# Comma-separated list of allowed origins. Defaults to local Vite/React ports and the production Vercel frontend.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000,https://smart-room-booking-bay.vercel.app}

