# GitHub Actions CI — push / PR 時 build、跑測試，並送 SonarQube Cloud 分析
# 放置位置：repo 根目錄下的  .github/workflows/ci.yml

name: CI

on:
  push:
    branches: [ main, master, new-version ]
  pull_request:

# 最小權限：只給讀取原始碼。順便清掉 CodeQL 報的 "Workflow does not contain permissions" (CWE-275)
permissions:
  contents: read

jobs:
  # ---------- 後端：Spring Boot / JUnit / JaCoCo / Sonar ----------
  backend:
    # 名稱保持與 branch protection ruleset 要求的必過檢查一致（除測試外另含 Sonar 分析）
    name: Backend build & test (Java 17)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # Sonar 需要完整 git 歷史來判斷 new code / blame
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Make mvnw executable
        run: chmod +x mvnw
      - name: Build, test & analyze
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        # verify 會跑 48 個測試 + 產 JaCoCo 報告 (target/site/jacoco/jacoco.xml)，
        # 之後 sonar:sonar 上傳分析。org/projectKey/host 來自 pom.xml 的 <properties>。
        run: ./mvnw -B verify org.sonarsource.scanner.maven:sonar-maven-plugin:sonar

  # ---------- 前端：Vite / Vitest / Sonar ----------
  frontend:
    # 名稱保持與 branch protection ruleset 要求的必過檢查一致（除測試外另含 Sonar 分析）
    name: Frontend test (Node 20)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install deps
        run: npm ci
      - name: Test with coverage
        run: npm run test:coverage    # 產生 coverage/lcov.info
      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@v5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          projectBaseDir: frontend    # 讀 frontend/sonar-project.properties
