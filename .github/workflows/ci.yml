# GitHub Actions CI — 每次 push / 開 PR 時自動 build 並跑後端測試
# 放置位置：repo 根目錄下的  .github/workflows/ci.yml
#
# ── 路徑設定（重要，二選一）─────────────────────────────────
# 預設假設你的 repo 根目錄是 SmartRoomBooking-new-version（底下有 backend/、frontend/），
# 所以下面用 working-directory: backend 把指令切到 backend 子目錄。
#   ▸ 若你的 repo 根目錄「本身就是 backend」（直接看得到 pom.xml、mvnw），
#     請把下方那兩行 `working-directory: backend` 刪掉即可。
# ──────────────────────────────────────────────────────────

name: CI

on:
  push:
    branches: [ main, master, new-version ]
  pull_request:                  # 任何 PR 都會跑

jobs:
  backend-test:
    name: Backend build & test (Java 17)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend   # ← repo 根目錄就是 backend 的話，刪掉這行（連同上面 defaults/run）

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'         # 對應 pom.xml 的 <java.version>17</java.version>
          cache: maven               # 快取 ~/.m2，第二次以後跑更快

      - name: Make mvnw executable
        run: chmod +x mvnw           # Windows 上 commit 的 mvnw 常缺執行權限，會 Permission denied

      - name: Run tests
        run: ./mvnw -B test          # 等同你本機跑的；H2 in-memory，CI 不需外接資料庫
                                     # 通過時 log 會出現 Tests run: 48, Failures: 0, Errors: 0
