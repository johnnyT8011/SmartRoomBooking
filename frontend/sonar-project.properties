sonar.organization=johnnyt8011
sonar.projectKey=johnnyt8011_SmartRoomBooking-frontend
sonar.host.url=https://sonarcloud.io

# 分析範圍：src 為原始碼，src/test 視為測試（兩者用 test.inclusions 區分，避免重疊衝突）
sonar.sources=src
sonar.tests=src
sonar.test.inclusions=src/test/**

# 不納入分析的檔案（啟動進入點、靜態資源、產出目錄）
sonar.exclusions=src/main.jsx,src/assets/**,coverage/**,dist/**

# Vitest 產生的覆蓋率報告
sonar.javascript.lcov.reportPaths=coverage/lcov.info
